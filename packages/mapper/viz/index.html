<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mapper Visualization</title>
<link rel="stylesheet" href="/styles.css">
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
<script src="/stats.js"></script>
</head>
<body>

<div id="tab-bar">
  <span id="tab-add" title="Open graph">+</span>
</div>

<div id="main">
  <div id="graph-container">
    <div id="loading">No graphs loaded. Click + to open a graph.</div>
    <div class="cy-tooltip" id="tooltip"></div>
  </div>

  <div id="side-panel">
    <div class="panel-section" id="graph-info">
      <h3>Graph Info</h3>
      <div id="graph-info-content">
        <div class="info-row"><span class="info-label">Name</span><span class="info-value" id="info-name">--</span></div>
        <div class="info-row"><span class="info-label">Nodes</span><span class="info-value" id="info-nodes">--</span></div>
        <div class="info-row"><span class="info-label">Edges</span><span class="info-value" id="info-edges">--</span></div>
        <div class="info-row"><span class="info-label">Metric</span><span class="info-value" id="info-metric">--</span></div>
        <div class="info-row"><span class="info-label">Clusterer</span><span class="info-value" id="info-clusterer">--</span></div>
        <div class="info-row"><span class="info-label">Cubes</span><span class="info-value" id="info-cubes">--</span></div>
        <div class="info-row"><span class="info-label">Overlap</span><span class="info-value" id="info-overlap">--</span></div>
      </div>
    </div>

    <div class="panel-section" id="selection-controls">
      <h3>Selection</h3>
      <div class="controls-row">
        <button class="group-btn group-a active" id="btn-group-a" onclick="setActiveGroup('A')">Group A</button>
        <button class="group-btn group-b" id="btn-group-b" onclick="setActiveGroup('B')">Group B</button>
        <button onclick="clearSelection()">Clear</button>
      </div>
      <div id="sel-summary" style="color:#888;font-size:11px;margin-top:4px"></div>
    </div>

    <div class="panel-section" id="selection-info" style="display:none">
      <h3>Selected Nodes</h3>
      <div id="selected-details"></div>
      <div class="member-list" id="member-list"></div>
      <div class="controls-row" style="margin-top:6px">
        <button onclick="compareGroups()">Compare A vs B</button>
        <button onclick="compareVsRest()">A vs Rest</button>
      </div>
    </div>

    <div class="panel-section" id="comparison-panel" style="display:none">
      <h3>Comparison Results</h3>
      <div id="comparison-summary"></div>
      <div id="comparison-table-wrap">
        <table id="comparison-table">
          <thead>
            <tr>
              <th class="sortable" onclick="sortCompTable('col')">Column</th>
              <th class="sortable" onclick="sortCompTable('p')">p-value</th>
              <th class="sortable" onclick="sortCompTable('q')">q-value</th>
              <th class="sortable" onclick="sortCompTable('diff')">Diff</th>
              <th>Test</th>
            </tr>
          </thead>
          <tbody id="comparison-body"></tbody>
        </table>
      </div>
    </div>

    <div class="panel-section">
      <h3>Layout</h3>
      <div class="controls-row">
        <select id="layout-select" onchange="runLayout()">
          <option value="fcose">fCoSE (force-directed)</option>
          <option value="cose">CoSE</option>
          <option value="circle">Circle</option>
          <option value="grid">Grid</option>
          <option value="concentric">Concentric</option>
        </select>
        <button onclick="runLayout()">Re-layout</button>
      </div>
    </div>
  </div>
</div>

<div id="toolbar">
  <label>Color:</label>
  <select id="color-select" onchange="recolor()">
    <option value="default">Default (lens value)</option>
    <option value="size">Node size</option>
    <option value="degree">Degree</option>
  </select>
  <button onclick="exportPNG()" title="Export graph as PNG">PNG</button>
  <button onclick="exportCSV()" title="Export data as CSV">CSV</button>
  <button onclick="showUploadDialog()" title="Upload CSV dataset">Upload</button>
  <button onclick="showRunDialog()" title="Configure and run mapper">Run Mapper</button>
  <span class="run-status" id="run-status"></span>
  <span class="status" id="status-bar">Ready</span>
</div>

<div id="graph-picker">
  <div class="modal">
    <h2>Open Graph</h2>
    <div id="graph-list"></div>
  </div>
</div>

<div id="upload-dialog" class="modal-overlay">
  <div class="modal">
    <h2>Upload Dataset</h2>
    <div class="form-group">
      <label for="csv-file">CSV File</label>
      <input type="file" id="csv-file" accept=".csv,.tsv,.txt">
    </div>
    <div class="form-group">
      <label for="dataset-name">Dataset Name</label>
      <input type="text" id="dataset-name" placeholder="my-dataset">
    </div>
    <div id="csv-preview"></div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="uploadDataset()">Upload</button>
      <button onclick="hideUploadDialog()">Cancel</button>
    </div>
  </div>
</div>

<div id="run-dialog" class="modal-overlay">
  <div class="modal modal-wide">
    <h2>Configure Mapper Run</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="run-dataset">Dataset</label>
        <select id="run-dataset"></select>
      </div>
      <div class="form-group">
        <label for="run-name">Run Name</label>
        <input type="text" id="run-name" placeholder="my run">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="run-ncubes">N Cubes</label>
        <input id="run-ncubes" type="number" value="10" min="2" max="100">
      </div>
      <div class="form-group">
        <label for="run-overlap">Overlap</label>
        <input id="run-overlap" type="number" value="0.5" min="0.01" max="0.99" step="0.05">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="run-metric">Metric</label>
        <select id="run-metric">
          <option value="euclidean">Euclidean</option>
          <option value="manhattan">Manhattan</option>
          <option value="chebyshev">Chebyshev</option>
          <option value="cosine">Cosine</option>
        </select>
      </div>
      <div class="form-group">
        <label for="run-clusterer">Clusterer</label>
        <select id="run-clusterer">
          <option value="slink">SLINK (hierarchical)</option>
          <option value="dbscan">DBSCAN</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="run-eps">Epsilon</label>
        <input id="run-eps" type="number" value="0.5" min="0.01" step="0.05">
      </div>
      <div class="form-group">
        <label for="run-minpts">Min Points (DBSCAN)</label>
        <input id="run-minpts" type="number" value="3" min="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="run-lens">Lens</label>
        <select id="run-lens" onchange="onLensChange()">
          <option value="l_inf_centrality">L-inf Centrality</option>
          <option value="eccentricity">Eccentricity</option>
          <option value="pca">PCA (1st component)</option>
          <option value="sum">Sum</option>
          <option value="mean">Mean</option>
          <option value="variance">Variance</option>
          <option value="kurtosis">Kurtosis</option>
          <option value="l2norm">L2 Norm</option>
          <option value="column">Column</option>
        </select>
      </div>
      <div class="form-group" id="col-select-group" style="display:none">
        <label for="run-colorcol">Column Index</label>
        <input id="run-colorcol" type="number" value="0" min="0">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="startRun()">Run Mapper</button>
      <button onclick="hideRunDialog()">Cancel</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
